<!DOCTYPE html>
<html lang="id">
<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap');

      background-color: #f8fafc;

    }

      .print-container {

        padding: 0 !important;

        max-width: 100% !important;
      }

      table {

        border-collapse: collapse !important;
      }

      th, td {
        border: 1px solid #000000 !important;
        padding: 6px 8px !important;
        vertical-align: top !important;
      }

      .kartu-soal-box {
        border: 1.5px solid #000000 !important;
        page-break-inside: avoid;
        break-inside: avoid;
        margin-bottom: 18px;
      }

      .soal-item {
        page-break-inside: avoid;
        break-inside: avoid;
      }
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- NAVBAR & PANEL KONTROL (Tidak Tercetak) -->

      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-emerald-500 flex items-center justify-center font-bold text-slate-950">
          BS
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight">Bank Soal Multi-Mapel</h1>
          <p class="text-xs text-slate-400">CP/ATP • Kisi-Kisi • Naskah Soal • Kartu Soal</p>
        </div>
      </div>

      <nav class="flex bg-slate-800 p-1 rounded-lg text-sm font-medium">
        <button onclick="switchTab('input')" id="tab-input" class="tab-btn px-3.5 py-1.5 rounded-md bg-emerald-600 text-white transition">
          + Input / Kelola
        </button>
        <button onclick="switchTab('kisi')" id="tab-kisi" class="tab-btn px-3.5 py-1.5 rounded-md text-slate-300 hover:text-white transition">
          1. Kisi-Kisi
        </button>
        <button onclick="switchTab('naskah')" id="tab-naskah" class="tab-btn px-3.5 py-1.5 rounded-md text-slate-300 hover:text-white transition">
          2. Naskah Soal
        </button>
        <button onclick="switchTab('kartu')" id="tab-kartu" class="tab-btn px-3.5 py-1.5 rounded-md text-slate-300 hover:text-white transition">
          3. Kartu Soal
        </button>
      </nav>

      <div class="flex items-center gap-2">
        <button onclick="syncFromSpreadsheet()" id="btn-sync" class="bg-slate-700 hover:bg-slate-600 text-xs font-semibold px-3 py-2 rounded-lg border border-slate-600 transition flex items-center gap-1.5">
          <span>🔄</span> Sinkron Sheets
        </button>
        <button onclick="window.print()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold px-4 py-2 rounded-lg shadow transition flex items-center gap-1.5">
          <span>🖨️</span> Cetak / Simpan PDF
        </button>
      </div>
    </div>
  </header>
